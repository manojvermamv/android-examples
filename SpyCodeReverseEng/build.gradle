// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "1.5.31"
    ext.google_services_version = '4.3.10'
    ext.android_plugin_version = '4.1.2'
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$android_plugin_version"
        classpath "com.google.gms:google-services:${google_services_version}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-android-extensions:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked"
        }
    }
}

ext {
    // Used by Main project
    activityVersion = '1.2.3'
    fragmentVersion = '1.2.0'
    appCompatVersion = '1.2.0'
    constraintLayoutVersion = '2.0.4'
    coreTestingVersion = '2.1.0'
    coroutines = '1.5.0'
    lifecycleVersionOld = '2.2.0'
    lifecycleVersion = '2.3.1'
    materialVersion = '1.3.0'
    annotationVersion = '1.4.0'
    recyclerViewVersion = '1.2.1'
    securityCrypto = '1.1.0-alpha01'
    multidex = '2.0.1'
    workManager = '2.3.4'
    googlePlayServices = '20.3.0'
    roomVersion = '2.3.0'
    retrofitVersion = '2.9.0'
    daggerVersion = '2.29'
    glideVersion = "4.12.0"
    firebaseUiVersion = '8.0.1'
    rxJavaVersion = "2.2.17"
    rxAndroidVersion = "2.1.1"
    rxRelayVersion = "2.1.1"
    rxQueueVersion = "2.0.0"
    // Used for testing - Main project
    junitVersion = '4.13.2'
    espressoVersion = '3.1.0'
    androidxJunitVersion = '1.1.2'

    configuration = [
            package          : "com.anubhav.codereverse",
            compileSdkVersion: 32,
            targetSdkVersion : 32,
            minSdkVersion    : 21,
            versionCode      : 1,
            versionName      : "1.1",
            buildToolsVersion: "32.0.0",

            // extra
            appName          : "Code Reverse",
    ]
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
        resValue "string", "app_font_bold", "font/proximanova_bold_font.otf"
        resValue "string", "app_font_custom", "font/hvd_comic_serif_pro.otf"
        resValue "string", "google_places_api_key", "AIzaSyADq5v1NLygroKXwal-aDyQOcidx84rLpo"

        // default config values
        buildConfigField "String", "APP_NAME", "\"$configuration.appName\""
        buildConfigField "String", "FILE_PROVIDER", "\"${applicationId + ".fileprovider"}\""
        buildConfigField "String", "DEEP_LINK_PREFIX", '"https://codereverse.page.link"'

        //Maps & Places * Here you must have to enable Billing info from Console of Google.
        buildConfigField "String", "MAPS_KEY", '"AIzaSyADq5v1NLygroKXwal-aDyQOcidx84rLpo"'
        buildConfigField "String", "ANDROID_KEY", '"YOUR_ANDROID_KEY"'
        buildConfigField "String", "DEVELOPER_ID", '"8256627302674614518"'
        buildConfigField "String", "FCM_SERVER_KEY", '"AAAAiNSdrlc:APA91bGJM0ggZYJ9Q8eXVStmSBTapGbCFinjkCVfk6rbQ5BZ51dLlpcDkY0Rx-RysiUW-ljW1STKTJakDRaSexu16NxusyOdr_dCrDiqcZFP0mVHlqCFjaMLQKIe0pm2K7hJ5y4Xwgsv"'

        //Test Ads Key
        buildConfigField 'boolean', "ADS_SHOWN", "true"
        resValue 'string', "main_app_id", "ca-app-pub-8676187581068146~3154011298"
        resValue 'string', "banner_app_id", "ca-app-pub-3940256099942544/6300978111"
        resValue 'string', "interstitial_app_id", "ca-app-pub-3940256099942544/1033173712"
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'InvalidPackage'
    }
    packagingOptions {
        exclude 'META-INF/*'
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    configurations.all {
        resolutionStrategy {
            force 'androidx.work:work-runtime:2.7.1'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'

    implementation "com.google.dagger:dagger-android:$daggerVersion"
    kapt "com.google.dagger:dagger-android-processor:$daggerVersion"
    kapt "com.google.dagger:dagger-compiler:$daggerVersion"

    implementation "androidx.appcompat:appcompat:$appCompatVersion"
    implementation "androidx.annotation:annotation:$annotationVersion"
    implementation "androidx.recyclerview:recyclerview:$recyclerViewVersion"
    implementation "androidx.constraintlayout:constraintlayout:$constraintLayoutVersion"
    implementation "com.google.android.material:material:$materialVersion"

    implementation 'com.google.android.gms:play-services-maps:18.1.0'

    implementation "androidx.activity:activity-ktx:$activityVersion"
    implementation "androidx.fragment:fragment-ktx:$fragmentVersion"
    implementation "androidx.preference:preference-ktx:$fragmentVersion"
    implementation "androidx.security:security-crypto:$securityCrypto"
    implementation "androidx.multidex:multidex:$multidex"
    implementation "androidx.work:work-runtime:$workManager"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycleVersionOld"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycleVersion"

    // Kotlin components & data binding
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines"

    // rx java
    api "io.reactivex.rxjava2:rxandroid:$rxAndroidVersion"
    api "io.reactivex.rxjava2:rxjava:$rxJavaVersion"
    api "com.jakewharton.rxrelay2:rxrelay:$rxRelayVersion"

    // Images Loading and Room database
    implementation "com.github.bumptech.glide:glide:$glideVersion"
    kapt "com.github.bumptech.glide:compiler:$glideVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"

    // Retrofit2 or Okhttp3
    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    implementation "com.squareup.retrofit2:converter-gson:$retrofitVersion"
    implementation "com.squareup.retrofit2:converter-scalars:$retrofitVersion"
    implementation(platform("com.squareup.okhttp3:okhttp-bom:4.10.0"))
    implementation("com.squareup.okhttp3:okhttp")
    implementation("com.squareup.okhttp3:logging-interceptor")

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:28.4.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-iid'

    // FirebaseUI
    implementation "com.firebaseui:firebase-ui-firestore:$firebaseUiVersion"
    implementation "com.firebaseui:firebase-ui-auth:$firebaseUiVersion"
    implementation "com.firebaseui:firebase-ui-database:$firebaseUiVersion"
    implementation "com.firebaseui:firebase-ui-storage:$firebaseUiVersion"
    
    // PictureSelector basic (Necessary)
    implementation 'io.github.lucksiege:pictureselector:v3.10.6'
    implementation 'com.github.yalantis:ucrop:2.2.6'

    // Custom UI
    implementation 'com.ms-square:expandableTextView:0.1.4'
    implementation 'com.github.abdulrehmank7:trapezium-view:1.01'
    implementation 'co.zsmb:materialdrawer-kt:3.0.0'
    implementation 'com.chillibits:simplesettings:1.3.4', {
        exclude group: 'com.mikepenz', module: 'fastadapter'
    }

    // Custom
    implementation 'org.jsoup:jsoup:1.10.3'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.airbnb.android:lottie:4.1.0'
    implementation 'org.threeten:threetenbp:1.6.0'
    implementation 'com.github.stfalcon-studio:StfalconImageViewer:v1.0.1'
    implementation 'com.mikhaellopez:circularimageview:4.3.0'
    implementation 'net.yslibrary.keyboardvisibilityevent:keyboardvisibilityevent:2.1.0'
    implementation "org.nanohttpd:nanohttpd:2.2.0"
    implementation "net.sourceforge.htmlunit:htmlunit-android:2.67.0", {
        exclude module: 'javax.annotation'
    }
    
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.arch.core:core-testing:$coreTestingVersion"
    androidTestImplementation("androidx.test.espresso:espresso-core:$espressoVersion", {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
}